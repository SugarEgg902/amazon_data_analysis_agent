# docker-compose.yml
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: amazon_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootroot"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_USER: 
      DB_PASS: 
      DB_NAME: amazon_db
      ANALYSIS_LLM_BASE_URL: "http://10.0.0.22:8005/v1"
      ANALYSIS_LLM_MODEL: "gemma-4-31b-it-fp8"
    restart: unless-stopped

volumes:
  mysql_data:
