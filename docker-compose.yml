# docker-compose.yml (储能竞品项目)
# 用 host 网络模式,容器直接共享宿主机网络,DB_HOST=localhost 即可连宿主机 MySQL。
#
# 凭据一律从 .env 读,不写在本文件里 —— 本仓库是公开的。
# 首次部署: cp .env.example .env 后填真值(.env 已在 .gitignore 中)。
services:
  fastapi:
    container_name: amazon-sellersprite
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: host
    env_file:
      - .env
    environment:
      # ===== 数据库(宿主机 MySQL,储能专用独立库) =====
      DB_HOST: "localhost"
      DB_USER: "root"
      DB_NAME: "amazon_sellersprite_db"

      # ===== LLM 服务 =====
      ANALYSIS_LLM_BASE_URL: "http://10.0.0.22:8005/v1"
      ANALYSIS_LLM_MODEL: "gemma-4-31b-it-fp8"

      TZ: Asia/Shanghai
    command: ["python", "run.py", "--port", "8006"]
    restart: unless-stopped
